name: Deploy production website

on:
  push:
    tags:
      - "deploy-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: begapunk-production
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and audit canonical release
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 75
    outputs:
      release_id: ${{ steps.identity.outputs.release_id }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
      editorial_trusted_base_sha: ${{ steps.editorial-baseline.outputs.sha }}

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-deploy.txt

      - name: Install PDF validation dependency
        run: python -m pip install --require-hashes -r .github/requirements-deploy.txt

      - name: Confirm release is the current main commit
        run: |
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Load protected editorial trust baseline
        id: editorial-baseline
        env:
          EDITORIAL_TRUSTED_BASE_SHA: ${{ vars.EDITORIAL_TRUSTED_BASE_SHA }}
        run: |
          [[ "$EDITORIAL_TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EDITORIAL_TRUSTED_BASE_SHA" != "$GITHUB_SHA"
          git cat-file -e "${EDITORIAL_TRUSTED_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EDITORIAL_TRUSTED_BASE_SHA" "$GITHUB_SHA"
          echo "EDITORIAL_TRUSTED_BASE_REF=$EDITORIAL_TRUSTED_BASE_SHA" >> "$GITHUB_ENV"
          echo "sha=$EDITORIAL_TRUSTED_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create immutable release identity
        id: identity
        run: |
          release_id="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::12}-r${GITHUB_RUN_ATTEMPT}"
          [[ "$release_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{5,100}$ ]]
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build and audit release once
        env:
          BEGAPUNK_RELEASE_ID: ${{ steps.identity.outputs.release_id }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npm run deploy:prepare

      - name: Bind protected release authorization and inquiry evidence
        env:
          RELEASE_APPROVED_SHA: ${{ vars.RELEASE_APPROVED_SHA }}
          RELEASE_AUTHORIZATION_REF: ${{ vars.RELEASE_AUTHORIZATION_REF }}
          INQUIRY_DELIVERY_APPLICABILITY: ${{ vars.INQUIRY_DELIVERY_APPLICABILITY }}
          INQUIRY_DELIVERY_APPROVED_SHA: ${{ vars.INQUIRY_DELIVERY_APPROVED_SHA }}
          INQUIRY_DELIVERY_EVIDENCE_REF: ${{ vars.INQUIRY_DELIVERY_EVIDENCE_REF }}
        run: npm run release:authorization:verify

      - name: Record canonical release manifest digest
        id: manifest
        run: echo "sha256=$(node scripts/release-manifest-digest.mjs)" >> "$GITHUB_OUTPUT"

      - name: Confirm generated source files are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify deployment shell and Nginx policy contracts
        run: |
          bash -n \
            ops/activate-release.sh \
            ops/bootstrap-server.sh \
            ops/install-nginx-managed-redirects.sh \
            ops/upgrade-deployment-hardening.sh \
            ops/verify-public-deployment.sh \
            tests/verify-public-deployment-headers.sh
          bash tests/verify-public-deployment-headers.sh
          bash ops/install-nginx-managed-redirects.sh validate ops/nginx-managed-redirects.conf

      - name: Upload canonical production artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: begapunk-production-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/production
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload release audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: begapunk-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/audit
          if-no-files-found: warn
          retention-days: 90

  inquiry-php:
    name: Inquiry PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
        env:
          fail-fast: true

      - name: Verify isolated inquiry failure paths
        run: npm run inquiry:php:verify
        env:
          BEGAPUNK_EXPECTED_PHP_MINOR: ${{ matrix.php }}

  lighthouse-performance:
    name: Lighthouse release performance
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the audited production artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: begapunk-production-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/production

      - name: Verify downloaded artifact identity
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-release.outputs.manifest_sha256 }}
        run: |
          test -n "$EXPECTED_MANIFEST_SHA256"
          test "$(node scripts/release-manifest-digest.mjs)" = "$EXPECTED_MANIFEST_SHA256"
          npm run deploy:validate

      - name: Verify pinned mobile performance matrix
        run: npm run lighthouse:release:verify

  validate-and-deploy:
    needs: [build-release, inquiry-php, lighthouse-performance]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the exact audited production artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: begapunk-production-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/production

      - name: Revalidate downloaded artifact integrity
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-release.outputs.manifest_sha256 }}
        run: |
          test -n "$EXPECTED_MANIFEST_SHA256"
          test "$(node scripts/release-manifest-digest.mjs)" = "$EXPECTED_MANIFEST_SHA256"
          npm run deploy:validate
          (cd dist/production && sha256sum --quiet -c manifest.sha256)

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Verify hardened server deployment contract
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( port >= 1 && port <= 65535 ))
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -p "$port"
          )

          ssh "${ssh_args[@]}" "$target" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          base_dir='/www/begapunk'
          current_link="$base_dir/current"
          helper='/usr/local/sbin/begapunk-nginx-config'
          inquiry_env="$base_dir/shared/.env"
          maintenance_lock="$base_dir/maintenance.lock"
          hardening_marker="$base_dir/.hardening-complete"
          expected_helper_version='begapunk-nginx-config-v3'
          expected_marker_version='v3'
          expected_doctor_result='begapunk-nginx-config-doctor-ok:v3'
          failures=0

          fail_check() {
            printf 'ERROR: %s\n' "$1" >&2
            failures=$((failures + 1))
          }

          if [[ ! -L "$current_link" ]]; then
            fail_check "$current_link must be a symbolic link to an initialized release."
          else
            active_release="$(readlink -f "$current_link" 2>/dev/null || true)"
            if [[ -z "$active_release" || "$active_release" != "$base_dir/releases/"* || ! -d "$active_release" || ! -f "$active_release/index.html" ]]; then
              fail_check "$current_link must resolve inside $base_dir/releases and contain index.html."
            else
              printf 'OK: active release %s\n' "$active_release"
              if [[ ! -f "$active_release/manifest.sha256" ]] \
                || ! (cd "$active_release" && sha256sum --quiet -c manifest.sha256); then
                fail_check 'The active rollback release failed its manifest integrity check.'
              else
                echo 'OK: active rollback release manifest verified'
              fi
            fi
          fi

          available_kib="$(df -Pk "$base_dir" | awk 'NR == 2 {print $4}')"
          available_inodes="$(df -Pi "$base_dir" | awk 'NR == 2 {print $4}')"
          if [[ ! "$available_kib" =~ ^[0-9]+$ ]] || (( available_kib < 1048576 )); then
            fail_check "At least 1 GiB of free deployment space is required; found ${available_kib:-unknown} KiB."
          else
            printf 'OK: deployment filesystem has %s KiB free\n' "$available_kib"
          fi
          if [[ ! "$available_inodes" =~ ^[0-9]+$ ]] || (( available_inodes < 10000 )); then
            fail_check "At least 10000 free inodes are required; found ${available_inodes:-unknown}."
          else
            printf 'OK: deployment filesystem has %s inodes free\n' "$available_inodes"
          fi

          if [[ ! -f "$helper" || -L "$helper" || ! -x "$helper" ]]; then
            fail_check "$helper must be a regular, non-symlink executable."
          else
            helper_metadata="$(stat -c '%U:%G:%a' "$helper" 2>/dev/null || true)"
            if [[ "$helper_metadata" != 'root:root:755' ]]; then
              fail_check "$helper must be owned by root:root with mode 0755; found ${helper_metadata:-unreadable}."
            else
              printf 'OK: privileged helper ownership and mode %s\n' "$helper_metadata"
            fi

            if helper_version="$(sudo -n "$helper" version 2>/dev/null)"; then
              if [[ "$helper_version" != "$expected_helper_version" ]]; then
                fail_check "privileged helper version mismatch; expected $expected_helper_version, found ${helper_version:-empty}."
              else
                printf 'OK: privileged helper version %s\n' "$helper_version"
              fi
            else
              fail_check "sudo -n $helper version failed; install the current helper and narrow sudoers rule."
            fi
          fi

          if [[ ! -f "$inquiry_env" || -L "$inquiry_env" ]]; then
            fail_check "$inquiry_env must be a regular, non-symlink file."
          else
            env_metadata="$(stat -c '%U:%G:%a' "$inquiry_env" 2>/dev/null || true)"
            if [[ "$env_metadata" != 'root:www:640' ]]; then
              fail_check "$inquiry_env must be owned by root:www with mode 0640; found ${env_metadata:-unreadable}."
            else
              printf 'OK: inquiry environment ownership and mode %s\n' "$env_metadata"
            fi
            # SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_TO are checked by
            # the fixed-path root helper; no credential values leave it.
            if smtp_result="$(sudo -n "$helper" smtp-check)" \
              && [[ "$smtp_result" == 'begapunk-smtp-check-ok:v1' ]]; then
              printf 'OK: required SMTP settings verified without exposing values\n'
            else
              fail_check 'privileged SMTP configuration check failed or is not installed.'
            fi
          fi

          if [[ ! -f "$maintenance_lock" || -L "$maintenance_lock" ]]; then
            fail_check "$maintenance_lock must be a regular, non-symlink file."
          else
            deployment_group="$(id -gn)"
            lock_metadata="$(stat -c '%U:%G:%a' "$maintenance_lock" 2>/dev/null || true)"
            if [[ "$lock_metadata" != "root:$deployment_group:660" ]]; then
              fail_check "$maintenance_lock must be owned by root:$deployment_group with mode 0660; found ${lock_metadata:-unreadable}."
            else
              printf 'OK: deployment maintenance lock ownership and mode %s\n' "$lock_metadata"
            fi
          fi

          if [[ ! -f "$hardening_marker" || -L "$hardening_marker" ]]; then
            fail_check "$hardening_marker must be a regular, non-symlink file."
          else
            marker_metadata="$(stat -c '%U:%G:%a' "$hardening_marker" 2>/dev/null || true)"
            if [[ "$marker_metadata" != 'root:root:644' ]]; then
              fail_check "$hardening_marker must be owned by root:root with mode 0644; found ${marker_metadata:-unreadable}."
            elif [[ "$(grep -Fxc "helper_version=$expected_marker_version" "$hardening_marker" 2>/dev/null || true)" != '1' ]]; then
              fail_check "$hardening_marker does not attest helper_version=$expected_marker_version exactly once."
            else
              printf 'OK: hardening marker ownership, mode and version %s\n' "$expected_marker_version"
            fi
          fi

          if doctor_output="$(sudo -n "$helper" doctor 2>/dev/null)"; then
            doctor_last_line="${doctor_output##*$'\n'}"
            if [[ "$doctor_last_line" != "$expected_doctor_result" ]]; then
              fail_check "privileged helper doctor result mismatch; expected $expected_doctor_result, found ${doctor_last_line:-empty}."
            else
              printf 'OK: privileged helper doctor %s\n' "$doctor_last_line"
            fi
          else
            fail_check "sudo -n $helper doctor failed; server hardening is incomplete or inconsistent."
          fi

          if (( failures > 0 )); then
            printf 'Deployment blocked: %d hardened server prerequisite(s) failed.\n' "$failures" >&2
            exit 1
          fi
          echo 'Hardened server deployment contract verified.'
          REMOTE

      - name: Prepare IndexNow URLs from the active release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          EDITORIAL_TRUSTED_BASE_SHA: ${{ needs.build-release.outputs.editorial_trusted_base_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$EDITORIAL_TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$port")
          active_release="$(ssh "${ssh_args[@]}" "$target" 'basename "$(readlink -f /www/begapunk/current)"')"
          if [[ "$active_release" =~ -([0-9a-f]{12})(-r[0-9]+)?$ ]] && git cat-file -e "${BASH_REMATCH[1]}^{commit}"; then
            active_release_commit="$(git rev-parse "${BASH_REMATCH[1]}^{commit}")"
            if [[ "$active_release_commit" != "$EDITORIAL_TRUSTED_BASE_SHA" ]]; then
              echo "Protected editorial baseline does not match the active production release." >&2
              exit 1
            fi
            node scripts/prepare-indexnow-urls.mjs "$active_release_commit" "$GITHUB_SHA" "$RUNNER_TEMP/indexnow-urls.txt"
          else
            echo "Active release commit could not be resolved to the protected editorial baseline." >&2
            exit 1
          fi

      - name: Upload immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ needs.build-release.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          release_id="$RELEASE_ID"
          [[ "$release_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{5,100}$ ]]
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$port")
          rsync_ssh="ssh -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p $port"
          previous_release_id="$(ssh "${ssh_args[@]}" "$target" 'basename "$(readlink -f /www/begapunk/current)"')"
          [[ "$previous_release_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{5,100}$ ]]
          previous_manifest_sha256="$(ssh "${ssh_args[@]}" "$target" \
            "sha256sum -- /www/begapunk/releases/$previous_release_id/manifest.sha256" | awk '{print $1}')"
          [[ "$previous_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          nginx_candidate="/www/begapunk/staging/nginx-managed-${release_id}.conf"
          echo "release_id=$release_id" >> "$GITHUB_ENV"
          echo "previous_release_id=$previous_release_id" >> "$GITHUB_ENV"
          echo "previous_manifest_sha256=$previous_manifest_sha256" >> "$GITHUB_ENV"
          echo "nginx_candidate=$nginx_candidate" >> "$GITHUB_ENV"

          ssh "${ssh_args[@]}" "$target" \
            "mkdir -p /www/begapunk/releases/$release_id /www/begapunk/bin /www/begapunk/staging"
          rsync -az --delete -e "$rsync_ssh" dist/production/ "$target:/www/begapunk/releases/$release_id/"
          rsync -az -e "$rsync_ssh" ops/activate-release.sh "$target:/www/begapunk/bin/activate-release.sh"
          rsync -az -e "$rsync_ssh" ops/nginx-managed-redirects.conf "$target:$nginx_candidate"
          ssh "${ssh_args[@]}" "$target" \
            "chmod 750 /www/begapunk/bin/activate-release.sh && chmod 640 '$nginx_candidate'"

      - name: Stage managed Nginx policy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$port")
          echo "nginx_transaction_attempted=true" >> "$GITHUB_ENV"
          ssh "${ssh_args[@]}" "$target" \
            "flock -w 30 /www/begapunk/maintenance.lock sudo -n /usr/local/sbin/begapunk-nginx-config stage '$nginx_candidate' '$release_id'"
          echo "nginx_transaction_staged=true" >> "$GITHUB_ENV"

      - name: Checkpoint production telemetry
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist/audit
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          port="${DEPLOY_PORT:-22}"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=15 -p "$port")
          expected_observer="$(sha256sum ops/production-telemetry.py | awk '{print $1}')"
          actual_observer="$(ssh "${ssh_args[@]}" "$target" 'sudo -n /usr/local/sbin/begapunk-nginx-config telemetry-version')"
          test "$actual_observer" = "$expected_observer"
          ssh "${ssh_args[@]}" "$target" \
            "sudo -n /usr/local/sbin/begapunk-nginx-config telemetry-start '$release_id'" \
            | tee dist/audit/production-telemetry-start.json

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-release.outputs.manifest_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$port")
          ssh "${ssh_args[@]}" "$target" \
            "flock -w 30 /www/begapunk/maintenance.lock /www/begapunk/bin/activate-release.sh '$release_id' '$EXPECTED_MANIFEST_SHA256'"

      - name: Verify public deployment boundary
        run: |
          mkdir -p dist/audit
          expected_homepage_sha256="$(sha256sum dist/production/index.html | awk '{print $1}')"
          expected_robots_sha256="$(sha256sum dist/production/robots.txt | awk '{print $1}')"
          expected_sitemap_sha256="$(sha256sum dist/production/sitemap.xml | awk '{print $1}')"
          expected_i18n_sitemap_sha256="$(sha256sum dist/production/sitemap-i18n.xml | awk '{print $1}')"
          BEGAPUNK_EXPECTED_HOMEPAGE_SHA256="$expected_homepage_sha256" \
          BEGAPUNK_EXPECTED_ROBOTS_SHA256="$expected_robots_sha256" \
          BEGAPUNK_EXPECTED_SITEMAP_SHA256="$expected_sitemap_sha256" \
          BEGAPUNK_EXPECTED_I18N_SITEMAP_SHA256="$expected_i18n_sitemap_sha256" \
            bash ops/verify-public-deployment.sh | tee dist/audit/public-boundary.log

      - name: Verify production navigation in a real browser
        run: npm run postdeploy:navigation:verify

      - name: Verify production telemetry before commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          port="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$port" "$target" \
            "sudo -n /usr/local/sbin/begapunk-nginx-config telemetry-check '$release_id'" \
            | tee dist/audit/production-telemetry-check.json

      - name: Commit deployment transaction
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$port")
          ssh "${ssh_args[@]}" "$target" \
            "flock -w 30 /www/begapunk/maintenance.lock sudo -n /usr/local/sbin/begapunk-nginx-config commit '$release_id' && rm -f -- '$nginx_candidate'"
          echo "deployment_committed=true" >> "$GITHUB_ENV"
          echo "redirect_mode=verified HTTP 301" >> "$GITHUB_ENV"

      - name: Roll back an uncommitted deployment
        if: ${{ always() && env.nginx_transaction_attempted == 'true' && env.deployment_committed != 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$port")

          if ! ssh "${ssh_args[@]}" "$target" 'bash -se' -- \
            "$previous_release_id" "$previous_manifest_sha256" "$release_id" "$nginx_candidate" <<'REMOTE'
          set -Eeuo pipefail
          previous_release_id="$1"
          previous_manifest_sha256="$2"
          release_id="$3"
          nginx_candidate="$4"
          maintenance_lock='/www/begapunk/maintenance.lock'
          rollback_failed=0
          release_recovered=false

          [[ "$previous_release_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{5,100}$ ]]
          [[ "$previous_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]

          exec 8<>"$maintenance_lock"
          if ! flock -w 45 8; then
            echo 'Could not acquire the deployment maintenance lock for rollback.' >&2
            exit 20
          fi

          current_release_id="$(basename "$(readlink -f /www/begapunk/current 2>/dev/null || true)")"
          if [[ "$current_release_id" == "$previous_release_id" ]]; then
            release_recovered=true
          elif /www/begapunk/bin/activate-release.sh "$previous_release_id" "$previous_manifest_sha256"; then
            release_recovered=true
          else
            current_release_id="$(basename "$(readlink -f /www/begapunk/current 2>/dev/null || true)")"
            if [[ "$current_release_id" == "$previous_release_id" ]]; then
              release_recovered=true
            else
              echo 'Release rollback failed; retaining the staged Nginx policy and transaction for manual recovery.' >&2
              rollback_failed=1
            fi
          fi

          if [[ "$release_recovered" == true ]]; then
            if ! sudo -n /usr/local/sbin/begapunk-nginx-config rollback "$release_id"; then
              echo 'Nginx transaction rollback failed; manual recovery is required.' >&2
              rollback_failed=1
            fi
          fi

          rm -f -- "$nginx_candidate" || rollback_failed=1
          [[ "$rollback_failed" -eq 0 ]]
          REMOTE
          then
            echo "::error::Deployment rollback failed or could not be confirmed; manual recovery is required."
            exit 1
          fi

      - name: Notify IndexNow of changed URLs
        id: indexnow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/submit-indexnow.mjs "$RUNNER_TEMP/indexnow-urls.txt"

      - name: Deployment summary
        env:
          INDEXNOW_OUTCOME: ${{ steps.indexnow.outcome }}
        run: |
          echo "### Begapunk production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`$release_id\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Legacy URL recovery: $redirect_mode" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$INDEXNOW_OUTCOME" == 'success' ]]; then
            echo "- IndexNow: changed URLs accepted" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- IndexNow: warning; notification failed and requires retry (deployment remains healthy)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload post-deployment audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: begapunk-postdeploy-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/audit
          if-no-files-found: warn
          retention-days: 90
