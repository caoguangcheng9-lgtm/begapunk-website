name: Deploy production website

on:
  push:
    tags:
      - "deploy-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: begapunk-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Confirm release commit belongs to main
        run: |
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Build and validate release
        run: npm run deploy:prepare

      - name: Confirm generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prepare IndexNow verification file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -Eeuo pipefail
          [[ "$INDEXNOW_KEY" =~ ^[A-Za-z0-9_-]{8,128}$ ]]
          key_file="${INDEXNOW_KEY}.txt"
          printf '%s' "$INDEXNOW_KEY" > "dist/production/$key_file"
          (cd dist/production && sha256sum "$key_file" >> manifest.sha256)

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Prepare IndexNow URLs from the active release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          active_release="$(ssh -p "$port" "$target" 'basename "$(readlink -f /www/begapunk/current)"')"
          if [[ "$active_release" =~ -([0-9a-f]{12})$ ]] && git cat-file -e "${BASH_REMATCH[1]}^{commit}"; then
            node scripts/prepare-indexnow-urls.mjs "${BASH_REMATCH[1]}" "$GITHUB_SHA" "$RUNNER_TEMP/indexnow-urls.txt"
          else
            echo "Active release commit could not be resolved; preparing the canonical sitemap set."
            node scripts/prepare-indexnow-urls.mjs --all "$GITHUB_SHA" "$RUNNER_TEMP/indexnow-urls.txt"
          fi

      - name: Upload immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          release_id="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::12}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$port" "$target" "mkdir -p /www/begapunk/releases/$release_id /www/begapunk/bin"
          rsync -az --delete -e "ssh -p $port" dist/production/ "$target:/www/begapunk/releases/$release_id/"
          rsync -az -e "ssh -p $port" \
            ops/activate-release.sh \
            ops/install-nginx-managed-redirects.sh \
            ops/nginx-managed-redirects.conf \
            "$target:/www/begapunk/bin/"
          ssh -p "$port" "$target" \
            "chmod 750 /www/begapunk/bin/activate-release.sh /www/begapunk/bin/install-nginx-managed-redirects.sh"
          redirect_mode="static canonical fallback"
          if ssh -p "$port" "$target" "sudo -n true"; then
            ssh -p "$port" "$target" \
              "sudo -n /www/begapunk/bin/install-nginx-managed-redirects.sh /www/begapunk/bin/nginx-managed-redirects.conf"
            redirect_mode="verified HTTP 301"
          else
            echo "::warning::Deployment account has no non-interactive sudo permission; keeping the canonical/meta-refresh fallback for the legacy URL."
          fi
          ssh -p "$port" "$target" "/www/begapunk/bin/activate-release.sh '$release_id'"
          echo "release_id=$release_id" >> "$GITHUB_ENV"
          echo "redirect_mode=$redirect_mode" >> "$GITHUB_ENV"

      - name: Verify public homepage
        run: |
          curl --fail --silent --show-error --max-time 30 https://www.begapunk.com/ | grep -Eiq '<html|<!doctype html|BEGAPUNK'

      - name: Verify legacy product URL recovery
        run: |
          set -Eeuo pipefail
          legacy_url="https://www.begapunk.com/3-in-3-out-Pneumatic-rotary-joint-P6776400.html"
          result="$(curl --silent --show-error --output /dev/null --max-time 30 --write-out '%{http_code}|%{redirect_url}' "$legacy_url")"
          if [[ "$result" == "301|https://www.begapunk.com/BP-3P-0004.html" ]]; then
            exit 0
          fi
          [[ "$result" == "200|" ]]
          curl --fail --silent --show-error --max-time 30 "$legacy_url" \
            | grep -Fq '<link rel="canonical" href="https://www.begapunk.com/BP-3P-0004.html">'

      - name: Notify IndexNow of changed URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/submit-indexnow.mjs "$RUNNER_TEMP/indexnow-urls.txt"

      - name: Deployment summary
        run: |
          echo "### Begapunk production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`$release_id\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Legacy URL recovery: $redirect_mode" >> "$GITHUB_STEP_SUMMARY"
          echo "- IndexNow: changed URLs accepted" >> "$GITHUB_STEP_SUMMARY"
