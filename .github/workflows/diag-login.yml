name: Diagnose login activity

# Read-only diagnostic: prints who logged into the production server.
# Safe to delete once the login alert has been explained.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Collect login records
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -u
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id -p "$PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "=== whoami ==="; id
          echo "=== date (server) ==="; date -u
          echo "=== currently logged in ==="; who -a 2>/dev/null || true
          echo "=== last 40 logins with IPs ==="; last -i -n 40 2>/dev/null || true
          echo "=== last reboot ==="; last -x reboot -n 5 2>/dev/null || true
          echo "=== wtmp tail ==="; last -i -n 15 -F 2>/dev/null || true
          echo "=== failed logins (needs root) ==="; (sudo -n lastb -i -n 25 2>/dev/null || lastb -i -n 25 2>/dev/null || echo 'not readable')
          echo "=== sshd accepted (needs root) ==="; (sudo -n grep -a 'Accepted' /var/log/secure 2>/dev/null | tail -25 || grep -a 'Accepted' /var/log/secure 2>/dev/null | tail -25 || echo 'not readable')
          echo "=== sudo allowed commands ==="; sudo -n -l 2>/dev/null || echo 'no passwordless sudo'
          REMOTE
