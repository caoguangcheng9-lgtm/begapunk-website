name: PR quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: begapunk-pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inquiry-php:
    name: Inquiry PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Check out pull request
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
        env:
          fail-fast: true

      - name: Verify isolated inquiry failure paths
        run: npm run inquiry:php:verify
        env:
          BEGAPUNK_EXPECTED_PHP_MINOR: ${{ matrix.php }}

  quality:
    needs: inquiry-php
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out pull request
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source, product, localization, claim, and release checks
        run: npm run quality:pr

      - name: Confirm generated assets are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
