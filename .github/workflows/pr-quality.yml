name: PR quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: begapunk-pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull request
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source, product, localization, claim, and release checks
        run: npm run quality:pr

      - name: Check deployment shell syntax
        run: bash -n ops/activate-release.sh ops/verify-current-release.sh

      - name: Check deployment PowerShell syntax
        shell: pwsh
        run: |
          [void][ScriptBlock]::Create((Get-Content -Raw deploy.ps1))
          [void][ScriptBlock]::Create((Get-Content -Raw sync-production-main.ps1))

      - name: Test deployment rollback safety
        run: bash tests/test-deployment-rollback.sh

      - name: Confirm generated assets are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
