# Begapunk legacy URL cleanup for Google Search Console
# Install inside the begapunk.com server block before the generic static handler.
# The current production server uses Nginx, so .htaccess rules are not applied.

# Old platform category URLs that still appear in Google Search Console.
rewrite ^/Pneumatic-rotary-joint-c[0-9]+/?$ /products.html permanent;
rewrite ^/Pneumatic-rotary-joint-c[0-9]+/.*$ /products.html permanent;
rewrite ^/Pneumatic-Fittings-c[0-9]+/?$ /products.html permanent;
rewrite ^/Pneumatic-Fittings-c[0-9]+/.*$ /products.html permanent;

# Begapunk no longer positions hydraulic-only pages as current site content.
location ~* ^/hydraulic-rotary-joint-c[0-9]+(?:/.*)?$ {
    return 410;
}

# Old functional URLs.
rewrite ^/inquiry/?$ /contact.html permanent;
rewrite ^/register/?$ /contact.html permanent;
rewrite ^/pages/faq\.html$ /faq.html permanent;
rewrite ^/pages/about-us(?:-[0-9]+)?\.html$ /about.html permanent;
rewrite ^/pages/privacy-policy\.html$ /privacy.html permanent;
rewrite ^/pages/payment-methods\.html$ /terms.html permanent;
rewrite ^/pages/warranty-and-return\.html$ /terms.html permanent;

# Old blog and tag URLs. Send useful legacy topics to the closest current hub.
rewrite ^/blog-123-13355/About-Begapunk-.*$ /about.html permanent;
rewrite ^/blog-123-13355/.*Laser-Pipe-Cutting.*$ /application-laser-tube-cutting.html permanent;
rewrite ^/blog-123-13355/.*Stainless-Steel.*$ /blog-rotary-joint-materials.html permanent;
rewrite ^/blog-123-13355/.*Pneumatic-Rotary-Joint.*Stainless-Steel.*$ /blog-rotary-joint-materials.html permanent;
rewrite ^/blog-123-13355/.*$ /blog.html permanent;
rewrite ^/tags/Stainless-Steel-Rotary-Joint\.html$ /blog-rotary-joint-materials.html permanent;
rewrite ^/tags/Low-speed-rotary-joint\.html$ /products.html permanent;
rewrite ^/tags/SMC-Rotary-Joints\.html$ /blog.html permanent;
rewrite ^/tags/.*$ /blog.html permanent;

# Old application/category feed-like URLs that should not remain index candidates.
location = /locales/en.json {
    return 410;
}

# Hosting placeholder URLs from the previous platform should be dropped.
location = /cgi-sys/suspendedpage.cgi {
    return 410;
}

# Former BP-2P-95-0001 product URL; current published page is BP-2P-95-0005.
rewrite ^/BP-2P-95-0001\.html$ https://www.begapunk.com/BP-2P-95-0005.html permanent;
