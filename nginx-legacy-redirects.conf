# Begapunk legacy URL cleanup for Google Search Console
# Install inside the begapunk.com server block before the generic static handler.
# The current production server uses Nginx, so .htaccess rules are not applied.

# Old platform category URLs that still appear in Google Search Console.
rewrite ^/Pneumatic-rotary-joint-c[0-9]+/?$ /products.html permanent;
rewrite ^/Pneumatic-rotary-joint-c[0-9]+/.*$ /products.html permanent;
rewrite ^/Hydraulic-rotary-joint-c[0-9]+/?$ /products.html permanent;
rewrite ^/Hydraulic-rotary-joint-c[0-9]+/.*$ /products.html permanent;
rewrite ^/HYDRAULIC-ROTARY-JOINT-C[0-9]+/?$ /products.html permanent;
rewrite ^/HYDRAULIC-ROTARY-JOINT-C[0-9]+/.*$ /products.html permanent;

# Old functional URLs.
rewrite ^/inquiry/?$ /contact.html permanent;
rewrite ^/register/?$ /contact.html permanent;
rewrite ^/pages/faq\.html$ /faq.html permanent;
rewrite ^/pages/about-us(?:-[0-9]+)?\.html$ /about.html permanent;
rewrite ^/pages/privacy-policy\.html$ /privacy.html permanent;
rewrite ^/pages/payment-methods\.html$ /terms.html permanent;

# Old blog and tag URLs. Use content hubs rather than 404 for retained topical relevance.
rewrite ^/blog-123-13355/.*$ /blog.html permanent;
rewrite ^/tags/.*$ /blog.html permanent;

# Old application/category feed-like URLs that should not remain index candidates.
rewrite ^/locales/en\.json$ / permanent;
